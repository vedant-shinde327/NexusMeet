<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>NexusMeet Icon</title>
  <desc>NexusMeet circular logo mark</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#3EC6E0"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3EC6E0" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Outer glow rings -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="url(#ringGrad)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#ringGrad)" stroke-width="0.8"/>

  <!-- Main circle -->
  <circle cx="100" cy="100" r="82" fill="url(#bgGrad)"/>

  <!-- 4-tile video grid -->
  <rect x="42" y="52" width="50" height="40" rx="6" fill="white" fill-opacity="0.18"/>
  <rect x="108" y="52" width="50" height="40" rx="6" fill="white" fill-opacity="0.18"/>
  <rect x="42" y="100" width="50" height="40" rx="6" fill="white" fill-opacity="0.18"/>
  <rect x="108" y="100" width="50" height="40" rx="6" fill="white" fill-opacity="0.36"/>

  <!-- Dividers -->
  <line x1="100" y1="52" x2="100" y2="140" stroke="white" stroke-width="1" stroke-opacity="0.18"/>
  <line x1="42" y1="96" x2="158" y2="96" stroke="white" stroke-width="1" stroke-opacity="0.18"/>

  <!-- Avatars top-left -->
  <circle cx="67" cy="67" r="7" fill="white" fill-opacity="0.72"/>
  <ellipse cx="67" cy="82" rx="10" ry="6" fill="white" fill-opacity="0.4"/>

  <!-- Avatars top-right -->
  <circle cx="133" cy="67" r="7" fill="white" fill-opacity="0.72"/>
  <ellipse cx="133" cy="82" rx="10" ry="6" fill="white" fill-opacity="0.4"/>

  <!-- Avatars bottom-left -->
  <circle cx="67" cy="115" r="7" fill="white" fill-opacity="0.72"/>
  <ellipse cx="67" cy="130" rx="10" ry="6" fill="white" fill-opacity="0.4"/>

  <!-- Active speaker bottom-right -->
  <circle cx="133" cy="115" r="7" fill="white" fill-opacity="0.95"/>
  <ellipse cx="133" cy="130" rx="10" ry="6" fill="white" fill-opacity="0.7"/>
  <rect x="108" y="100" width="50" height="40" rx="6" fill="none" stroke="white" stroke-width="2.2" stroke-opacity="0.9"/>

  <!-- Controls bar -->
  <rect x="76" y="148" width="48" height="14" rx="7" fill="white" fill-opacity="0.18"/>
  <circle cx="88" cy="155" r="3" fill="white" fill-opacity="0.7"/>
  <circle cx="100" cy="155" r="3" fill="white" fill-opacity="0.7"/>
  <circle cx="112" cy="155" r="3" fill="white" fill-opacity="0.7"/>
</svg>
